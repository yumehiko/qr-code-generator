name: Signed macOS release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: macos-15-intel
    outputs:
      release_commit: ${{ steps.release.outputs.commit }}
      release_version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+){0,2}([-.][0-9A-Za-z.-]+)?$ ]]
          VERSION="${TAG#v}"
          COMMIT="$(git rev-list -n 1 "$TAG")"
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$COMMIT" origin/main
          printf 'commit=%s\nversion=%s\n' "$COMMIT" "$VERSION" >> "$GITHUB_OUTPUT"

  release:
    needs: preflight
    runs-on: macos-15-intel
    environment: release
    permissions:
      contents: write
    env:
      BUNDLE_ID: ${{ vars.MACOS_BUNDLE_ID }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.release_version }}
      BUILD_VERSION: ${{ github.run_number }}
      APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.release_commit }}
      - name: Validate release settings
        run: |
          set -euo pipefail
          [[ -n "$BUNDLE_ID" && "$BUNDLE_ID" != com.example.* ]]
          [[ -n "${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}" ]]
          [[ -n "${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}" ]]
          [[ -n "${{ secrets.APPSTORE_CONNECT_API_KEY_P8_BASE64 }}" ]]
          [[ -n "${{ secrets.APPSTORE_CONNECT_KEY_ID }}" ]]
          [[ -n "$APPSTORE_CONNECT_ISSUER_ID" ]]
      - name: Import signing certificate
        id: signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '\"' '/Developer ID Application:/ { print $2; exit }')"
          [[ -n "$IDENTITY" ]]
          printf 'identity=%s\nkeychain=%s\ncertificate=%s\n' "$IDENTITY" "$KEYCHAIN_PATH" "$CERTIFICATE_PATH" >> "$GITHUB_OUTPUT"
      - name: Build and sign universal app
        env:
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          scripts/build-release.sh
          scripts/sign-app.sh
      - name: Create notarization API key
        id: notary
        env:
          API_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_API_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          umask 077
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          printf '%s' "$API_KEY_BASE64" | /usr/bin/base64 -D > "$API_KEY_PATH"
          printf 'path=%s\nkey_id=%s\n' "$API_KEY_PATH" "$KEY_ID" >> "$GITHUB_OUTPUT"
      - name: Notarize and staple app
        run: scripts/notarize.sh app "dist/QR Code Generator.app" "${{ steps.notary.outputs.path }}" "${{ steps.notary.outputs.key_id }}"
      - name: Package, notarize, and staple DMG
        run: |
          scripts/create-dmg.sh "$RELEASE_VERSION"
          scripts/notarize.sh dmg "dist/QRCodeGenerator-${RELEASE_VERSION}-universal.dmg" "${{ steps.notary.outputs.path }}" "${{ steps.notary.outputs.key_id }}"
          scripts/verify-dmg.sh "dist/QRCodeGenerator-${RELEASE_VERSION}-universal.dmg"
      - name: Write checksum
        run: shasum -a 256 "dist/QRCodeGenerator-${RELEASE_VERSION}-universal.dmg" > dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "dist/QRCodeGenerator-${RELEASE_VERSION}-universal.dmg" dist/SHA256SUMS.txt --title "$TAG" --generate-notes
      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "${{ steps.signing.outputs.certificate }}" "${{ steps.notary.outputs.path }}"
          security delete-keychain "${{ steps.signing.outputs.keychain }}" || true
