name: Signed macOS release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: macos-15-intel
    outputs:
      release_commit: ${{ steps.release.outputs.commit }}
      release_version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION="${TAG#v}"
          COMMIT="$(git rev-list -n 1 "$TAG")"
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$COMMIT" origin/main
          printf 'commit=%s\nversion=%s\n' "$COMMIT" "$VERSION" >> "$GITHUB_OUTPUT"

  release:
    needs: preflight
    runs-on: macos-15-intel
    environment: release
    permissions:
      contents: write
    env:
      BUNDLE_ID: ${{ vars.MACOS_BUNDLE_ID }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.release_version }}
      BUILD_VERSION: ${{ github.run_number }}
      APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
      APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.release_commit }}
      - name: Prepare temporary credential paths
        run: |
          set -euo pipefail
          umask 077
          printf 'CERTIFICATE_PATH=%s\n' "$RUNNER_TEMP/developer-id.p12" >> "$GITHUB_ENV"
          printf 'SIGNING_KEYCHAIN_PATH=%s\n' "$RUNNER_TEMP/signing.keychain-db" >> "$GITHUB_ENV"
          printf 'NOTARIZATION_KEY_PATH=%s\n' "$RUNNER_TEMP/notarization-api-key.p8" >> "$GITHUB_ENV"
          printf 'KEYCHAIN_SEARCH_LIST_PATH=%s\n' "$RUNNER_TEMP/original-keychain-search-list" >> "$GITHUB_ENV"
      - name: Validate release settings
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          API_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$BUNDLE_ID" && "$BUNDLE_ID" != com.example.* ]]
          [[ -n "$CERTIFICATE_BASE64" ]]
          [[ -n "$CERTIFICATE_PASSWORD" ]]
          [[ -n "$API_KEY_BASE64" ]]
          [[ -n "$APPSTORE_CONNECT_KEY_ID" ]]
          [[ -n "$APPSTORE_CONNECT_ISSUER_ID" ]]
      - name: Import signing certificate
        id: signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security list-keychains -d user > "$KEYCHAIN_SEARCH_LIST_PATH"
          printf '%s' "$CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$SIGNING_KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN_PATH"
          security list-keychain -d user -s "$SIGNING_KEYCHAIN_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$SIGNING_KEYCHAIN_PATH" | awk -F '\"' '/Developer ID Application:/ { print $2; exit }')"
          [[ -n "$IDENTITY" ]]
          printf 'identity=%s\n' "$IDENTITY" >> "$GITHUB_OUTPUT"
      - name: Build and sign universal app
        env:
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          scripts/build-release.sh
          scripts/sign-app.sh
      - name: Create notarization API key
        id: notary
        env:
          API_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$API_KEY_BASE64" | /usr/bin/base64 -D > "$NOTARIZATION_KEY_PATH"
      - name: Notarize and staple app
        run: scripts/notarize.sh app "dist/QR Code Generator.app" "$NOTARIZATION_KEY_PATH" "$APPSTORE_CONNECT_KEY_ID"
      - name: Package, notarize, and staple DMG
        run: |
          scripts/create-dmg.sh "$RELEASE_VERSION"
          scripts/notarize.sh dmg "dist/QRCodeGenerator-${RELEASE_VERSION}-universal.dmg" "$NOTARIZATION_KEY_PATH" "$APPSTORE_CONNECT_KEY_ID"
          scripts/verify-dmg.sh "dist/QRCodeGenerator-${RELEASE_VERSION}-universal.dmg"
      - name: Write checksum
        run: shasum -a 256 "dist/QRCodeGenerator-${RELEASE_VERSION}-universal.dmg" > dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "dist/QRCodeGenerator-${RELEASE_VERSION}-universal.dmg" dist/SHA256SUMS.txt --title "$TAG" --generate-notes
      - name: Remove temporary credentials
        if: always()
        run: |
          if [ -f "$KEYCHAIN_SEARCH_LIST_PATH" ]; then
            keychains=()
            while IFS= read -r keychain; do
              keychains+=("$keychain")
            done < <(sed -E 's/^[[:space:]]*"(.*)"[[:space:]]*$/\1/' "$KEYCHAIN_SEARCH_LIST_PATH")
            if [ "${#keychains[@]}" -gt 0 ]; then
              security list-keychains -d user -s "${keychains[@]}" || true
            fi
          fi
          rm -f "$CERTIFICATE_PATH" "$NOTARIZATION_KEY_PATH"
          security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
          rm -f "$KEYCHAIN_SEARCH_LIST_PATH"
